
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Digital Aero</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', Helvetica, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at 20% 20%, #b5f6ff, transparent 40%),
                radial-gradient(circle at 80% 80%, #9ff2d0, transparent 40%),
                linear-gradient(135deg, #d9faff, #b9eaff, #dffff3);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* CONTAINER PRINCIPAL */

        .tv-container {
            display: flex;

            width: 95%;
            max-width: 1600px;
            height: 90vh;

            gap: 20px;
        }

        /* PAINÉIS */

        .left-panel {
            display: flex;
            flex-direction: column;

            width: 35%;
            gap: 20px;
        }

        .right-panel {
            display: flex;
            flex-direction: column;

            width: 65%;
            gap: 20px;
        }

        /* CAIXAS */

        .box {
            position: relative;
            overflow: hidden;

            background: linear-gradient(
                145deg,
                rgba(255,255,255,0.85),
                rgba(177,237,248,0.65),
                rgba(160,241,216,0.55)
            );

            border: 2px solid rgba(255,255,255,0.95);
            border-radius: 24px;

            padding: 25px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 10px 30px rgba(24,132,175,0.18),
                inset 0 3px 8px rgba(255,255,255,0.95),
                inset 0 -3px 8px rgba(50,180,200,0.08);
        }

        /* REFLEXO DE LUZ */

        .box::before {
            content: "";

            position: absolute;
            top: 0;
            left: 10%;

            width: 80%;
            height: 3px;

            background: linear-gradient(
                90deg,
                transparent,
                white,
                transparent
            );

            opacity: 0.9;
        }

        .box::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -80px;
            top: -90px;

            border-radius: 50%;

            background: radial-gradient(
                circle,
                rgba(255,255,255,0.65),
                transparent 70%
            );

            pointer-events: none;
        }

        /* TÍTULOS */

        .box-title {
            position: relative;
            z-index: 1;

            color: #247a9c;

            font-size: clamp(16px, 2.2vw, 32px);
            font-weight: bold;

            text-transform: uppercase;
            letter-spacing: 2px;

            text-shadow:
                0 2px 5px rgba(255,255,255,0.9);

            margin-bottom: 18px;
        }

        /* PAINEL DE LOCALIZAÇÃO */

        .local-box {
            flex: 1;
        }

        .local-number {
            position: relative;
            z-index: 1;

            color: #13b9d8;

            font-size: clamp(55px, 9vw, 140px);
            font-weight: bold;

            line-height: 1;

            text-shadow:
                0 4px 0 rgba(255,255,255,0.8),
                0 8px 20px rgba(0,160,210,0.25);
        }

        /* BRILHO DECORATIVO */

        .local-number::after {
            content: "";

            display: block;

            width: 60%;
            height: 5px;

            margin: 15px auto 0;

            border-radius: 50%;

            background: linear-gradient(
                90deg,
                transparent,
                #42d9ed,
                transparent
            );

            box-shadow: 0 0 12px #42d9ed;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 700px) {
            body {
                overflow: auto;
                padding: 12px;
            }

            .tv-container {
                flex-direction: column;
                height: auto;
                width: 100%;
            }

            .left-panel,
            .right-panel {
                width: 100%;
            }

            .box {
                min-height: 180px;
            }

            .box-title {
                font-size: 20px;
            }

            .local-number {
                font-size: 75px;
            }
        }
    </style>
</head>

<body>

    <div class="tv-container">

        <div class="left-panel">

            <div class="box local-box">
                <h2 class="box-title">Localização</h2>
                <div class="local-number">01</div>
            </div>

        </div>

        <div class="right-panel">

            <div class="box">
                <h2 class="box-title">Painel de informações</h2>
            </div>

        </div>

    </div>

</body>
</html>
