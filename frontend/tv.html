<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
         * { box-sizing: border-box; margin: 0%; padding: 0%; font-family: Arial, Helvetica, sans-serif;}

         body {
            background-color: azure;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
         }

         .tv-container{
            display: flex;
            width: 95vh;
            height: 90vh;
            gap: 18px;
         }

         .left-panel {
            display: flex;
            flex-direction: column;
            width: 35%;
            gap: 18px;
         }

         .right-panel {
            display: flex;
            flex-direction: column;
            width: 65%;
            gap: 18px;
         }

         .box {
            background-color: rgb(130, 203, 203);
            border: 6px solid rgb(54, 106, 211);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px black;
         }

         .box-title {
            color: aliceblue;
            font-size: 2.2vw;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px black;
            margin-bottom: 12px;
         }

         .local-box { flex: 1;}

         .local-number {
            color:aqua;
            font-size: 9vw;
            font-weight: bold;
            line-height: 1;
         }
    </style>
    <title>Document</title>
</head>
<body>
    
</body>
</html>
